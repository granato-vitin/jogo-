<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong - Jogo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00ff88;
        }

        .subtitulo {
            color: #aaa;
            margin-bottom: 20px;
        }

        .placar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            margin-bottom: 15px;
        }

        .jogador {
            min-width: 150px;
        }

        .jogador h2 {
            font-size: 18px;
            color: #00d9ff;
        }

        #placar1,
        #placar2 {
            font-size: 55px;
            font-weight: bold;
        }

        #placar1 {
            color: #00d9ff;
        }

        #placar2 {
            color: #ff3b81;
        }

        canvas {
            width: 100%;
            max-width: 900px;
            height: auto;
            background: #05070b;
            border: 3px solid #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
            display: block;
            margin: auto;
        }

        .controles {
            display: flex;
            justify-content: space-around;
            margin: 15px auto;
            max-width: 900px;
            color: #bbb;
            font-size: 14px;
        }

        .controles span {
            color: white;
            font-weight: bold;
        }

        button {
            background: #00ff88;
            border: none;
            color: #06100b;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin: 8px;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #00d9ff;
        }

        .painel {
            margin-top: 25px;
            background: #10141d;
            border: 1px solid #252c39;
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .painel h2 {
            color: #00ff88;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #252c39;
        }

        th {
            color: #00d9ff;
        }

        td {
            color: #ddd;
        }

        .vencedor {
            color: #00ff88;
            font-size: 25px;
            font-weight: bold;
            margin: 15px;
            min-height: 30px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 35px;
            }

            .placar {
                gap: 30px;
            }

            #placar1,
            #placar2 {
                font-size: 40px;
            }

            .controles {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏓 PONG</h1>
    <p class="subtitulo">Primeiro jogador a chegar a 10 pontos vence!</p>

    <div class="placar">
        <div class="jogador">
            <h2>JOGADOR 1</h2>
            <div id="placar1">0</div>
        </div>

        <div>
            <strong>VS</strong>
        </div>

        <div class="jogador">
            <h2>JOGADOR 2</h2>
            <div id="placar2">0</div>
        </div>
    </div>

    <canvas id="jogo" width="900" height="500"></canvas>

    <div class="vencedor" id="mensagem"></div>

    <div class="controles">
        <div>
            Jogador 1:
            <span>W</span> / <span>S</span>
        </div>

        <div>
            Jogador 2:
            <span>↑</span> / <span>↓</span>
        </div>
    </div>

    <button onclick="novoJogo()">Novo Jogo</button>
    <button onclick="limparRecordes()">Limpar Recordes</button>

    <div class="painel">
        <h2>🏆 Tabela de Recordes</h2>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Jogador</th>
                    <th>Pontos</th>
                    <th>Data</th>
                </tr>
            </thead>

            <tbody id="recordes">
            </tbody>
        </table>
    </div>

</div>

<script>

    // =========================
    // CONFIGURAÇÕES
    // =========================

    const canvas = document.getElementById("jogo");
    const ctx = canvas.getContext("2d");

    const largura = canvas.width;
    const altura = canvas.height;

    const pontosParaVencer = 10;

    // =========================
    // PLACAR
    // =========================

    let pontos1 = 0;
    let pontos2 = 0;

    // =========================
    // RAQUETES
    // =========================

    const raquete = {
        largura: 15,
        altura: 100,
        velocidade: 7
    };

    let jogador1 = {
        x: 25,
        y: altura / 2 - raquete.altura / 2,
        pontos: 0
    };

    let jogador2 = {
        x: largura - 40,
        y: altura / 2 - raquete.altura / 2,
        pontos: 0
    };

    // =========================
    // BOLA
    // =========================

    let bola = {
        x: largura / 2,
        y: altura / 2,
        tamanho: 12,
        velocidadeX: 6,
        velocidadeY: 4
    };

    // =========================
    // TECLAS
    // =========================

    const teclas = {};

    document.addEventListener("keydown", function(event) {

        teclas[event.key.toLowerCase()] = true;

        // Evita que as setas rolem a página
        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === " "
        ) {
            event.preventDefault();
        }

        // Espaço reinicia depois da partida
        if (
            event.code === "Space" &&
            (pontos1 >= pontosParaVencer ||
             pontos2 >= pontosParaVencer)
        ) {
            novoJogo();
        }
    });

    document.addEventListener("keyup", function(event) {
        teclas[event.key.toLowerCase()] = false;
    });

    // =========================
    // DESENHAR QUADRA
    // =========================

    function desenharQuadra() {

        ctx.fillStyle = "#05070b";
        ctx.fillRect(0, 0, largura, altura);

        // Linha central
        ctx.strokeStyle = "#26303d";
        ctx.setLineDash([12, 15]);
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(largura / 2, 0);
        ctx.lineTo(largura / 2, altura);
        ctx.stroke();

        ctx.setLineDash([]);

        // Círculo central
        ctx.strokeStyle = "#1b2633";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(largura / 2, altura / 2, 70, 0, Math.PI * 2);
        ctx.stroke();
    }

    // =========================
    // DESENHAR RAQUETES
    // =========================

    function desenharRaquetes() {

        // Jogador 1
        ctx.fillStyle = "#00d9ff";

        ctx.shadowColor = "#00d9ff";
        ctx.shadowBlur = 15;

        ctx.fillRect(
            jogador1.x,
            jogador1.y,
            raquete.largura,
            raquete.altura
        );

        // Jogador 2
        ctx.fillStyle = "#ff3b81";

        ctx.shadowColor = "#ff3b81";

        ctx.fillRect(
            jogador2.x,
            jogador2.y,
            raquete.largura,
            raquete.altura
        );

        ctx.shadowBlur = 0;
    }

    // =========================
    // DESENHAR BOLA
    // =========================

    function desenharBola() {

        ctx.fillStyle = "#ffffff";

        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 20;

        ctx.beginPath();

        ctx.arc(
            bola.x,
            bola.y,
            bola.tamanho,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }

    // =========================
    // MOVIMENTO DOS JOGADORES
    // =========================

    function moverJogadores() {

        // Jogador 1 - W/S
        if (teclas["w"]) {
            jogador1.y -= raquete.velocidade;
        }

        if (teclas["s"]) {
            jogador1.y += raquete.velocidade;
        }

        // Jogador 2 - setas
        if (teclas["arrowup"]) {
            jogador2.y -= raquete.velocidade;
        }

        if (teclas["arrowdown"]) {
            jogador2.y += raquete.velocidade;
        }

        // Limites jogador 1
        if (jogador1.y < 0) {
            jogador1.y = 0;
        }

        if (jogador1.y + raquete.altura > altura) {
            jogador1.y = altura - raquete.altura;
        }

        // Limites jogador 2
        if (jogador2.y < 0) {
            jogador2.y = 0;
        }

        if (jogador2.y + raquete.altura > altura) {
            jogador2.y = altura - raquete.altura;
        }
    }

    // =========================
    // RESETAR BOLA
    // =========================

    function resetarBola(direcao) {

        bola.x = largura / 2;
        bola.y = altura / 2;

        bola.velocidadeX = 6 * direcao;

        // Direção vertical aleatória
        bola.velocidadeY =
            (Math.random() > 0.5 ? 1 : -1) *
            (3 + Math.random() * 2);
    }

    // =========================
    // COLISÃO
    // =========================

    function colisao(raqueteAtual) {

        return (
            bola.x - bola.tamanho < raqueteAtual.x + raquete.largura &&
            bola.x + bola.tamanho > raqueteAtual.x &&
            bola.y - bola.tamanho < raqueteAtual.y + raquete.altura &&
            bola.y + bola.tamanho > raqueteAtual.y
        );
    }

    // =========================
    // MOVIMENTO DA BOLA
    // =========================

    function moverBola() {

        // Se alguém já ganhou, não continua
        if (
            pontos1 >= pontosParaVencer ||
            pontos2 >= pontosParaVencer
        ) {
            return;
        }

        bola.x += bola.velocidadeX;
        bola.y += bola.velocidadeY;

        // Parede superior
        if (bola.y - bola.tamanho <= 0) {
            bola.y = bola.tamanho;
            bola.velocidadeY *= -1;
        }

        // Parede inferior
        if (bola.y + bola.tamanho >= altura) {
            bola.y = altura - bola.tamanho;
            bola.velocidadeY *= -1;
        }

        // Colisão com jogador 1
        if (colisao(jogador1) && bola.velocidadeX < 0) {

            bola.x = jogador1.x + raquete.largura + bola.tamanho;

            bola.velocidadeX *= -1;

            // Altera o ângulo dependendo de onde bateu
            let pontoContato =
                bola.y -
                (jogador1.y + raquete.altura / 2);

            bola.velocidadeY = pontoContato * 0.12;

            // Aumenta a velocidade
            bola.velocidadeX *= 1.05;
        }

        // Colisão com jogador 2
        if (colisao(jogador2) && bola.velocidadeX > 0) {

            bola.x = jogador2.x - bola.tamanho;

            bola.velocidadeX *= -1;

            let pontoContato =
                bola.y -
                (jogador2.y + raquete.altura / 2);

            bola.velocidadeY = pontoContato * 0.12;

            bola.velocidadeX *= 1.05;
        }

        // Bola saiu pela esquerda
        if (bola.x < 0) {

            pontos2++;

            atualizarPlacar();

            verificarVencedor();

            if (pontos2 < pontosParaVencer) {
                resetarBola(1);
            }
        }

        // Bola saiu pela direita
        if (bola.x > largura) {

            pontos1++;

            atualizarPlacar();

            verificarVencedor();

            if (pontos1 < pontosParaVencer) {
                resetarBola(-1);
            }
        }
    }

    // =========================
    // ATUALIZAR PLACAR
    // =========================

    function atualizarPlacar() {

        document.getElementById("placar1").textContent = pontos1;
        document.getElementById("placar2").textContent = pontos2;
    }

    // =========================
    // VERIFICAR VENCEDOR
    // =========================

    function verificarVencedor() {

        const mensagem =
            document.getElementById("mensagem");

        if (pontos1 >= pontosParaVencer) {

            mensagem.textContent =
                "🎉 JOGADOR 1 VENCEU!";

            salvarRecorde("Jogador 1", pontos1);
        }

        if (pontos2 >= pontosParaVencer) {

            mensagem.textContent =
                "🎉 JOGADOR 2 VENCEU!";

            salvarRecorde("Jogador 2", pontos2);
        }
    }

    // =========================
    // NOVO JOGO
    // =========================

    function novoJogo() {

        pontos1 = 0;
        pontos2 = 0;

        jogador1.y =
            altura / 2 - raquete.altura / 2;

        jogador2.y =
            altura / 2 - raquete.altura / 2;

        atualizarPlacar();

        document.getElementById("mensagem").textContent = "";

        resetarBola(
            Math.random() > 0.5 ? 1 : -1
        );
    }

    // =========================
    // RECORDES
    // =========================

    function salvarRecorde(jogador, pontos) {

        let recordes =
            JSON.parse(
                localStorage.getItem("pongRecordes")
            ) || [];

        const agora = new Date();

        const data =
            agora.toLocaleDateString("pt-BR");

        recordes.push({
            jogador: jogador,
            pontos: pontos,
            data: data
        });

        // Ordena pela maior pontuação
        recordes.sort(function(a, b) {
            return b.pontos - a.pontos;
        });

        // Mantém somente os 10 melhores
        recordes = recordes.slice(0, 10);

        localStorage.setItem(
            "pongRecordes",
            JSON.stringify(recordes)
        );

        mostrarRecordes();
    }

    // =========================
    // MOSTRAR RECORDES
    // =========================

    function mostrarRecordes() {

        const tabela =
            document.getElementById("recordes");

        let recordes =
            JSON.parse(
                localStorage.getItem("pongRecordes")
            ) || [];

        tabela.innerHTML = "";

        if (recordes.length === 0) {

            tabela.innerHTML = `
                <tr>
                    <td colspan="4">
                        Nenhum recorde ainda
                    </td>
                </tr>
            `;

            return;
        }

        recordes.forEach(function(recorde, index) {

            const linha =
                document.createElement("tr");

            linha.innerHTML = `
                <td>${index + 1}</td>
                <td>${recorde.jogador}</td>
                <td>${recorde.pontos}</td>
                <td>${recorde.data}</td>
            `;

            tabela.appendChild(linha);
        });
    }

    // =========================
    // LIMPAR RECORDES
    // =========================

    function limparRecordes() {

        const confirmar =
            confirm(
                "Tem certeza que deseja apagar todos os recordes?"
            );

        if (confirmar) {

            localStorage.removeItem("pongRecordes");

            mostrarRecordes();
        }
    }

    // =========================
    // LOOP DO JOGO
    // =========================

    function atualizar() {

        moverJogadores();
        moverBola();

        desenharQuadra();
        desenharRaquetes();
        desenharBola();

        requestAnimationFrame(atualizar);
    }

    // =========================
    // INICIAR
    // =========================

    mostrarRecordes();

    novoJogo();

    atualizar();

</script>

</body>
</html>
