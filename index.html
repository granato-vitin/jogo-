```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tetris</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <h1>TETRIS</h1>

        <div class="game-area">

            <canvas id="tetris" width="300" height="600"></canvas>

            <aside class="side-panel">

                <div class="info">
                    <h2>PONTOS</h2>
                    <p id="score">0</p>
                </div>

                <div class="info">
                    <h2>LINHAS</h2>
                    <p id="lines">0</p>
                </div>

                <div class="info">
                    <h2>NÍVEL</h2>
                    <p id="level">1</p>
                </div>

                <button id="restart">
                    REINICIAR
                </button>

                <div class="controls">
                    <h3>CONTROLES</h3>

                    <p>⬅️ ➡️ Mover</p>
                    <p>⬇️ Acelerar</p>
                    <p>⬆️ Girar</p>
                    <p>ESPAÇO - Queda rápida</p>
                    <p>P - Pausar</p>
                </div>

            </aside>

        </div>

        <div id="game-over" class="game-over hidden">

            <h2>GAME OVER</h2>

            <p>Sua pontuação:</p>

            <strong id="final-score">0</strong>

            <button id="restart-game">
                JOGAR NOVAMENTE
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
```
